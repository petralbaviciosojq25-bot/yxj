<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090711" />
    <meta name="description" content="Yara — visual design portfolio" />
    <title>Portfolio — Yara</title>
    <link rel="preload" as="image" href="./assets/optimized/109.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <style>
      #site-preloader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#090711;color:#f5efff;font-family:Inter,system-ui,sans-serif;transition:opacity .55s ease,visibility .55s ease}
      #site-preloader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      .preloader-name{font-size:clamp(38px,7vw,80px);font-weight:650;letter-spacing:-.06em;line-height:1}
      .preloader-track{width:min(220px,56vw);height:2px;overflow:hidden;background:rgba(190,143,255,.22)}
      .preloader-track::after{content:"";display:block;width:42%;height:100%;background:#b679ff;animation:preloader-sweep 1.35s ease-in-out infinite alternate}
      .preloader-caption{font-size:11px;letter-spacing:.24em;color:#bdaaca}
      @keyframes preloader-sweep{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
      @media(prefers-reduced-motion:reduce){#site-preloader{transition:none}.preloader-track::after{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="site-preloader" role="status" aria-label="作品集加载中">
      <span class="preloader-name" aria-hidden="true">YARA.</span>
      <span class="preloader-track" aria-hidden="true"></span>
      <span class="preloader-caption" aria-hidden="true">正在准备首页</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
